<!DOCTYPE html>
<html lang="id">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}SITI - Solusi Interaktif Teknologi Informasi{% endblock %}</title>
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%23c41e3a'>P</text></svg>">
</head>
<body>
    
    <nav class="navbar" style="width: 100%;">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 1rem 2rem; box-sizing: border-box;">
            
            <div>
                <a href="/" class="logo-text" style="text-decoration: none; display: flex; align-items: center; gap: 0.5rem;">
                    <span style="color: var(--primary); font-size: 1.5rem;">▸</span>
                    <span style="font-weight: bold; font-size: 1.25rem;">SITI</span>
                </a>
            </div>
            
            <div style="display: flex; align-items: center;">
                
                <button class="hidden-mobile" onclick="toggleMobileMenu()" style="background: none; border: none; cursor: pointer; font-size: 1.5rem; display: none; margin-right: 1rem;" id="mobile-menu-btn">
                    ☰
                </button>

                <div class="theme-toggle-container">
                    <label for="theme-toggle" class="theme-label">
                        <input type="checkbox" id="theme-toggle" class="theme-checkbox">
                        <span class="theme-icon">
                            <span class="sun">☀️</span>
                            <span class="moon">🌙</span>
                        </span>
                    </label>
                </div>
                
            </div>
        </div>
    </nav>
    
    <div id="mobile-menu" class="hidden" style="display: none; background-color: var(--gray-100); padding: 1rem; border-top: 1px solid var(--border-light);">
        {% block mobile_menu %}{% endblock %}
    </div>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    {% block footer %}
    <footer style="border-top: 1px solid var(--border-light); margin-top: 4rem; padding: 2rem; text-align: center; color: var(--gray-600);">
        <div class="container">
            <p>&copy; 2026 Pertamina.</p>
        </div>
    </footer>
    {% endblock %}
    
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
    
    <style>
        .navbar {
            border-bottom: 1px solid var(--border-light);
            background-color: var(--bg-light);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        body.dark-mode .navbar {
            background-color: var(--gray-900);
            border-bottom-color: var(--border-dark);
        }
        
        .logo-text {
            color: var(--text-light);
            text-decoration: none;
        }
        
        body.dark-mode .logo-text {
            color: var(--text-dark);
        }
        
        .theme-toggle-container {
            position: relative;
        }
        
        .theme-checkbox {
            display: none;
        }
        
        .theme-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            width: 50px;
            height: 26px;
            background-color: var(--gray-200);
            border-radius: 13px;
            padding: 3px;
            transition: background-color 0.3s;
        }
        
        body.dark-mode .theme-label {
            background-color: var(--gray-700);
        }
        
        .theme-icon {
            display: flex;
            align-items: center;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            left: 3px;
            transition: left 0.3s;
            justify-content: center;
        }
        
        body.dark-mode .theme-icon {
            left: 27px;
            background-color: var(--gray-800);
        }
        
        .theme-icon .moon {
            display: none;
        }
        
        body.dark-mode .theme-icon .sun {
            display: none;
        }
        
        body.dark-mode .theme-icon .moon {
            display: inline;
        }
        
        .theme-icon span {
            font-size: 0.875rem;
        }
        
        @media (max-width: 768px) {
            #mobile-menu-btn {
                display: inline-block !important;
            }
        }
    </style>
</body>

</html>
