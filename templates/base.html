{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertamina AI Assistant</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body id="theme-body">

    <!-- TOP NAVBAR -->
    {% include "components/navbar.html" %}

    <!-- MAIN LAYOUT -->
    <div class="container-fluid p-0">
        <div class="d-flex" id="app-layout">

            <!-- SIDEBAR -->
            <div id="sidebar" class="sidebar">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Conversations</h5>
                </div>

                <input class="form-control search-bar mb-3" placeholder="Search...">

                <ul class="list-group">
                    <li class="list-group-item">Chat 1</li>
                    <li class="list-group-item">Chat 2</li>
                </ul>

            </div>

            <!-- CONTENT / CHAT AREA -->
            <div class="chat-area flex-grow-1 d-flex flex-column">

                <div class="messages flex-grow-1 p-4" id="messages">
                    {% block content %}
                    {% endblock %}
                </div>

                <!-- CHAT INPUT -->
                <div class="chat-input p-3 border-top d-flex gap-2">
                    <input class="form-control" placeholder="Ketik pesan...">
                    <button class="btn text-white">
                        <i class="bi bi-send"></i>
                    </button>
                </div>

            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- =========================
         THEME + SIDEBAR SCRIPT
    ========================== -->

    <script>
        function applyTheme(theme) {
            const body = document.getElementById("theme-body");
            body.classList.remove("dark", "light");
            body.classList.add(theme);

            const icon = document.getElementById("theme-icon");
            if (icon) {
                icon.className = theme === "dark"
                    ? "bi bi-sun fs-5"
                    : "bi bi-moon fs-5";
            }
        }

        function detectSystemTheme() {
            return window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        }

        function toggleTheme() {
            const body = document.getElementById("theme-body");
            const current = body.classList.contains("dark") ? "dark" : "light";
            const newTheme = current === "dark" ? "light" : "dark";

            applyTheme(newTheme);
            localStorage.setItem("theme", newTheme);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            sidebar.classList.toggle("collapsed");
        }

        document.addEventListener("DOMContentLoaded", function () {
            const savedTheme = localStorage.getItem("theme");

            if (savedTheme) {
                applyTheme(savedTheme);
            } else {
                applyTheme(detectSystemTheme());
            }
        });

        window.matchMedia("(prefers-color-scheme: dark)")
            .addEventListener("change", e => {
                if (!localStorage.getItem("theme")) {
                    applyTheme(e.matches ? "dark" : "light");
                }
            });
    </script>

</body>
</html>
