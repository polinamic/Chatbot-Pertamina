name: Run Tests & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbot_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    
    - name: Run migrations
      run: |
        python manage.py migrate --noinput
    
    - name: Run unit and integration tests
      run: |
        pytest tests/ -m "not e2e" -v --cov=apps --cov-report=xml --cov-report=term-missing
    
    - name: Run security tests
      run: |
        pytest tests/test_database.py::TestSecurityVulnerabilities -v
    
    - name: Run API tests
      run: |
        pytest tests/test_api.py -v
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  e2e-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    
    - name: Install Chrome
      uses: browser-actions/setup-chrome@latest
    
    - name: Install ChromeDriver
      uses: nanasess/setup-chromedriver@master
    
    - name: Run migrations
      run: |
        python manage.py migrate --noinput
    
    - name: Start development server
      run: |
        python manage.py runserver &
        sleep 5
    
    - name: Run E2E tests
      run: |
        pytest tests/test_e2e.py -v --timeout=60
    
    - name: Upload E2E test results
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: e2e-screenshots
        path: screenshots/

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort bandit safety
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 apps/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 apps/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code format with black
      run: |
        black --check apps/
    
    - name: Check import sorting with isort
      run: |
        isort --check-only apps/
    
    - name: Security check with bandit
      run: |
        bandit -r apps/ -f json -o bandit-report.json || true
    
    - name: Check dependencies with safety
      run: |
        safety check --json || true

  coverage-check:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    
    - name: Run migrations
      run: |
        python manage.py migrate --noinput
    
    - name: Generate coverage report
      run: |
        pytest tests/ -m "not e2e" --cov=apps --cov-report=term-missing --cov-report=html
    
    - name: Check coverage threshold
      run: |
        # Require at least 80% coverage
        coverage report --fail-under=80
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-report
        path: htmlcov/
